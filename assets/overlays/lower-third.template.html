<!doctype html>
<!--
  Lower third em ALPHA (fundo transparente), 5 s, só entrada (sem saída), sem glow e sem drop shadow (o editor põe no editor de vídeo).
  Troque __TITLE__ e __SUBTITLE__ (e as cores em :root). Renderize:
    node scripts/render.mjs --html lower-third.html --out lower-third.mov --mode alpha --dedupe --width 3840 --height 2160 --fps 30
  16:9, medidas em unidades de 3840×2160 (q()). Margem 150, canto inferior esquerdo.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lower third</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600&display=block" rel="stylesheet">
<style>
  :root{--font-text:'Inter',system-ui,sans-serif;--card:rgba(20,22,26,.92);--fg:#fff;--fg-dim:rgba(255,255,255,.7);--accent:#8fb0ff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:transparent;overflow:hidden}
  body{display:grid;place-items:center}
  #f{position:relative;width:min(100vw,177.778vh);aspect-ratio:16/9;container-type:inline-size;overflow:hidden;background:transparent;font-family:var(--font-text);-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<div id="f"></div>
<script>
var raf = 0;
const Wd = 3840, q = n => (n / (Wd / 100)).toFixed(3) + 'cqw';
const lerp = (a, b, t) => a + (b - a) * t, clamp = x => Math.min(1, Math.max(0, x)), prog = (t, a, b) => clamp((t - a) / (b - a));
function bezier(x1, y1, x2, y2) { const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = s => ((ax * s + bx) * s + cx) * s, Y = s => ((ay * s + by) * s + cy) * s;
  return p => { if (p <= 0) return 0; if (p >= 1) return 1; let lo = 0, hi = 1, s = p; for (let i = 0; i < 40; i++) { s = (lo + hi) / 2; X(s) < p ? lo = s : hi = s; } return Y(s); }; }
const ease = bezier(0.16, 1, 0.3, 1), win = (t, a, b) => ease(prog(t, a, b));
let PX = 1;   // px de tela por unidade de design (travar no pixel = sem tremor)
const snap = v => Math.round(v * PX) / PX;
/* entrada: fade + blur vindo de um lado. Anti-flicker: translate em px inteiros, blur some < 0,3 px, trava quando falta < 0,5 px, sem will-change */
function inS(t, a, d = 1, dx = 0, dy = 0, bl = 22) {
  const p = win(t, a, a + d); if (p <= 0) return 'opacity:0;';
  const amp = Math.max(Math.abs(dx), Math.abs(dy), bl) * PX; if (p >= 1 || (amp > 0 && (1 - p) * amp < .5)) return '';
  const b = (1 - p) * bl * PX;
  return `opacity:${Math.min(1, p * 1.5).toFixed(3)};transform:translate(${q(snap((1 - p) * dx))},${q(snap((1 - p) * dy))});${b > .3 ? `filter:blur(${q((1 - p) * bl)});` : ''}`;
}
window.DUR = 5.0;
const CARD = { x: 150, b: 150, w: 1500, h: 330 };
function draw(t) {
  const top = 2160 - CARD.b - CARD.h, bar = win(t, .35, 1.4);
  return `<div style="position:absolute;left:${q(CARD.x)};top:${q(top)};width:${q(CARD.w)};height:${q(CARD.h)};border-radius:${q(48)};background:var(--card);${inS(t, .1, 1.3, 0, 70, 16)}">
    <div style="position:absolute;left:${q(54)};top:${q(54)};width:${q(10)};height:${q(CARD.h - 108)};border-radius:${q(5)};background:var(--accent);transform-origin:0 0;transform:scaleY(${bar.toFixed(4)})"></div>
    <div style="position:absolute;left:${q(120)};top:0;bottom:0;right:${q(60)};display:flex;flex-direction:column;justify-content:center">
      <div style="${inS(t, .55, 1.1, 0, 44)}font-size:${q(104)};font-weight:600;line-height:1.05;color:var(--fg);letter-spacing:-.015em">__TITLE__</div>
      <div style="${inS(t, .7, 1.1, 0, 44)}margin-top:${q(18)};font-size:${q(52)};font-weight:400;line-height:1.3;color:var(--fg-dim)">__SUBTITLE__</div>
    </div></div>`;
}
const root = document.getElementById('f');
window.render = t => { PX = root.clientWidth * (window.devicePixelRatio || 1) / Wd; root.innerHTML = draw(Math.min(window.DUR, Math.max(0, t))); };
document.fonts.ready.then(() => { const t0 = performance.now(); (function loop() { render(((performance.now() - t0) / 1000) % (window.DUR + .8)); raf = requestAnimationFrame(loop); })(); });
</script>
</body>
</html>
